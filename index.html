<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROSA Tech — Evaluación Ergonómica</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; margin: 0; }
    .container { display: flex; flex-direction: column; align-items: center; gap: 15px; }
    .viewport { position: relative; width: 100%; max-width: 640px; aspect-ratio: 4/3; background: #000; border-radius: 12px; overflow: hidden; }
    video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    
    .controls-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .btn { background: #0284c7; color: white; border: none; padding: 10px 20px; font-size: 14px; font-weight: bold; border-radius: 8px; cursor: pointer; }
    .btn-secondary { background: #334155; }
    .btn-danger { background: #e11d48; }

    .panel-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 620px; }
    .card { background: #1e293b; padding: 12px; border-radius: 8px; border-top: 4px solid #38bdf8; text-align: center; }
    .card-title { font-size: 11px; color: #94a3b8; text-transform: uppercase; font-weight: bold; }
    .card-value { font-size: 22px; font-weight: bold; color: #38bdf8; margin-top: 4px; }
    
    .risk-banner { width: 100%; max-width: 600px; background: #1e293b; padding: 15px; border-radius: 8px; border-left: 5px solid #f87171; text-align: center; }
    .risk-score { font-size: 28px; font-weight: bold; color: #f87171; }
  </style>
</head>
<body>

  <div class="container">
    <h2>📊 ROSA Tech — Evaluación en Tiempo Real</h2>

    <div class="viewport">
      <video id="input_video" playsinline></video>
      <canvas id="output_canvas"></canvas>
    </div>

    <!-- Botones de Control de Cámara -->
    <div class="controls-row" id="controles_camara">
      <button id="btn_cam" class="btn" onclick="iniciarCamara()">Iniciar Evaluación</button>
    </div>

    <div class="panel-grid">
      <div class="card">
        <div class="card-title">Score Silla</div>
        <div class="card-value" id="score_silla">-</div>
      </div>
      <div class="card">
        <div class="card-title">Score Pantalla</div>
        <div class="card-value" id="score_pantalla">-</div>
      </div>
      <div class="card">
        <div class="card-title">Score Teclado</div>
        <div class="card-value" id="score_teclado">-</div>
      </div>
    </div>

    <div class="risk-banner" id="banner_riesgo">
      <div>PUNTUACIÓN FINAL ROSA</div>
      <div class="risk-score" id="score_final">--</div>
      <div id="texto_riesgo" style="color: #94a3b8;">Inicie la cámara para calcular riesgo</div>
    </div>
  </div>

  <script src="./rosaEngine.js"></script>

  <script>
    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');

    let cameraInstance = null;
    let currentFacingMode = 'user'; // 'user' = frontal, 'environment' = trasera

    const POSE_CONNECTIONS = [
      [11, 12], [11, 13], [13, 15],
      [12, 14], [14, 16],
      [11, 23], [12, 24], [23, 24]
    ];

    function calcularAngulo(p1, p2, p3) {
      const radiants = Math.atan2(p3.y - p2.y, p3.x - p2.x) - Math.atan2(p1.y - p2.y, p1.x - p2.x);
      let angle = Math.abs((radiants * 180.0) / Math.PI);
      if (angle > 180.0) angle = 360.0 - angle;
      return Math.round(angle);
    }

    const pose = new Pose({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });

    pose.setOptions({
      modelComplexity: 1,
      smoothLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    pose.onResults(onResults);

    function onResults(results) {
      if (!videoElement.videoWidth) return;

      canvasElement.width = videoElement.videoWidth;
      canvasElement.height = videoElement.videoHeight;

      canvasCtx.save();
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      if (results.poseLandmarks) {
        const lm = results.poseLandmarks;

        let anguloCodo = 0;
        let inclinacionCuello = 0;

        if (lm[11] && lm[13] && lm[15]) {
          anguloCodo = calcularAngulo(lm[11], lm[13], lm[15]);
        }
        if (lm[7] && lm[11]) {
          inclinacionCuello = Math.round(Math.abs(lm[7].x - lm[11].x) * 100);
        }

        const colorEstado = (anguloCodo >= 80 && anguloCodo <= 110) ? '#4ade80' : '#f87171';

        canvasCtx.strokeStyle = colorEstado;
        canvasCtx.lineWidth = 3;
        for (const conn of POSE_CONNECTIONS) {
          const from = lm[conn[0]];
          const to = lm[conn[1]];
          if (from && to) {
            canvasCtx.beginPath();
            canvasCtx.moveTo(from.x * canvasElement.width, from.y * canvasElement.height);
            canvasCtx.lineTo(to.x * canvasElement.width, to.y * canvasElement.height);
            canvasCtx.stroke();
          }
        }

        for (const landmark of lm) {
          canvasCtx.beginPath();
          canvasCtx.arc(landmark.x * canvasElement.width, landmark.y * canvasElement.height, 4, 0, 2 * Math.PI);
          canvasCtx.fillStyle = '#38bdf8';
          canvasCtx.fill();
        }

        if (lm[13]) {
          canvasCtx.fillStyle = '#ffffff';
          canvasCtx.font = 'bold 14px system-ui';
          canvasCtx.fillText(`${anguloCodo}°`, lm[13].x * canvasElement.width + 8, lm[13].y * canvasElement.height);
        }

        const datosCaptura = {
          silla: { 
            altura: 2, profundidad: 2, ajustesAsiento: 1, apoyabrazos: 2, 
            ajustesApoyabrazos: 1, respaldo: inclinacionCuello > 15 ? 3 : 2, 
            ajustesRespaldo: 1, tiempoUso: 1 
          },
          pantalla: { posicion: inclinacionCuello > 15 ? 3 : 1, ajustes: 1, tiempoUso: 1 },
          telefono: { posicion: 2, ajustes: 1, tiempoUso: 1 },
          teclado: { posicion: (anguloCodo < 80 || anguloCodo > 110) ? 3 : 1, ajustes: 1, tiempoUso: 1 },
          mouse: { posicion: 2, ajustes: 1 }
        };

        if (typeof evaluarROSA === 'function') {
          const evaluacion = evaluarROSA(datosCaptura);
          
          document.getElementById('score_silla').innerText = evaluacion.score_silla;
          document.getElementById('score_pantalla').innerText = evaluacion.score_pantalla_telefono;
          document.getElementById('score_teclado').innerText = evaluacion.score_teclado_mouse;
          document.getElementById('score_final').innerText = evaluacion.puntuacion_final;
          document.getElementById('texto_riesgo').innerText = evaluacion.nivel_riesgo;

          const banner = document.getElementById('banner_riesgo');
          if (evaluacion.puntuacion_final >= 5) {
            banner.style.borderColor = '#f87171';
            document.getElementById('score_final').style.color = '#f87171';
          } else {
            banner.style.borderColor = '#4ade80';
            document.getElementById('score_final').style.color = '#4ade80';
          }
        }
      }
      canvasCtx.restore();
    }

    async function iniciarCamara(facing = 'user') {
      try {
        currentFacingMode = facing;
        if (cameraInstance) {
          await cameraInstance.stop();
        }

        cameraInstance = new Camera(videoElement, {
          onFrame: async () => {
            await pose.send({image: videoElement});
          },
          width: 640,
          height: 480,
          facingMode: currentFacingMode
        });

        await cameraInstance.start();

        // Reemplazar el botón de inicio por los controles activos (Cambiar cámara y Salir)
        document.getElementById('controles_camara').innerHTML = `
          <button class="btn btn-secondary" onclick="cambiarCamara()">🔄 Cambiar Cámara</button>
          <button class="btn btn-danger" onclick="apagarCamara()">⏹ Salir de Cámara</button>
        `;
      } catch (err) {
        const txt = document.getElementById('texto_riesgo');
        if (txt) txt.innerText = `Error al acceder a la cámara: ${err.message}`;
      }
    }

    function cambiarCamara() {
      const nuevoFacing = currentFacingMode === 'user' ? 'environment' : 'user';
      iniciarCamara(nuevoFacing);
    }

    async function apagarCamara() {
      if (cameraInstance) {
        await cameraInstance.stop();
        cameraInstance = null;
      }

      if (videoElement.srcObject) {
        const tracks = videoElement.srcObject.getTracks();
        tracks.forEach(track => track.stop());
        videoElement.srcObject = null;
      }

      // Limpiar canvas y scores
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
      document.getElementById('score_silla').innerText = '-';
      document.getElementById('score_pantalla').innerText = '-';
      document.getElementById('score_teclado').innerText = '-';
      document.getElementById('score_final').innerText = '--';
      document.getElementById('texto_riesgo').innerText = 'Cámara detenida.';

      // Restaurar botón inicial
      document.getElementById('controles_camara').innerHTML = `
        <button id="btn_cam" class="btn" onclick="iniciarCamara('user')">Iniciar Evaluación</button>
      `;
    }
  </script>
</body>
</html>
