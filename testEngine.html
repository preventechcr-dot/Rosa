<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prueba Motor ROSA Tech - GitHub Pages</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; }
    .card { background: #1e293b; padding: 20px; border-radius: 8px; border-left: 4px solid #38bdf8; margin-top: 15px; }
    .title { color: #38bdf8; font-weight: bold; font-size: 18px; margin-bottom: 10px; }
    .alert { color: #f87171; font-weight: bold; }
    pre { background: #020617; padding: 12px; border-radius: 6px; overflow-x: auto; color: #38bdf8; }
  </style>
</head>
<body>

  <h2>🧪 Validador del Motor ROSA Tech</h2>
  <p>Verificando respuestas del motor con un puesto de alto riesgo...</p>

  <div id="resultado" class="card">Ejecutando script...</div>

  <script src="./rosaEngine.js"></script>

  <script>
    const datosPrueba = {
      silla: { altura: 2, profundidad: 2, ajustesAsiento: 1, apoyabrazos: 2, ajustesApoyabrazos: 1, respaldo: 2, ajustesRespaldo: 1, tiempoUso: 1 },
      pantalla: { posicion: 3, ajustes: 1, tiempoUso: 1 },
      telefono: { posicion: 2, ajustes: 2 },
      teclado: { posicion: 2, ajustes: 1, tiempoUso: 1 },
      mouse: { posicion: 2, ajustes: 1 }
    };

    try {
      const res = calcularRosa(datosPrueba);

      document.getElementById('resultado').innerHTML = `
        <div class="title">✓ Cálculo Exitoso</div>
        <p><strong>Score Silla:</strong> ${res.score_silla}</p>
        <p><strong>Score Pantalla/Teléfono:</strong> ${res.score_pantalla_telefono}</p>
        <p><strong>Score Teclado/Mouse:</strong> ${res.score_teclado_mouse}</p>
        <p><strong>Puntuación Final ROSA:</strong> <span style="font-size: 22px;">${res.puntuacion_final}</span></p>
        <p class="alert">Nivel de Riesgo: ${res.nivel_riesgo}</p>
        <hr style="border-color: #334155;">
        <p>Salida JSON:</p>
        <pre>${JSON.stringify(res, null, 2)}</pre>
      `;
    } catch (error) {
      document.getElementById('resultado').innerHTML = `<span class="alert">Error: ${error.message}</span>`;
    }
  </script>
</body>
</html>
